url: https://map-lab-uw.github.io/FARL/

home:
  title: "FARL: Use Factor-Augmented Regularized Latent Regression for Large-Scale Assessment"
  description: >
    FARL implements factor-augmented regularized latent regression for
    large-scale assessments with high-dimensional, strongly dependent
    background variables. It combines common latent factors with sparsely
    selected idiosyncratic components and supports plausible-value generation
    for group-level inference.

template:
  bootstrap: 5
  bootswatch: flatly
  math-rendering: katex
#  includes:
#    in_header: pkgdown/favicon.html

